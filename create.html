{% extends "base.html" %}

{% block title %}
Write a Post - My Blog
{% endblock %}


{% block content %}

<section class="form-section">

    <h1>Write a New Post</h1>

    <form method="POST" class="post-form">

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter your post title"
            required
        >


        <label for="category">
            Category
        </label>

        <input
            type="text"
            id="category"
            name="category"
            placeholder="Technology, Travel, Personal..."
        >


        <label for="content">
            Content
        </label>

        <textarea
            id="content"
            name="content"
            rows="15"
            placeholder="Write your post here..."
            required
        ></textarea>


        <button type="submit" class="button">
            Publish Post
        </button>

    </form>

</section>

{% endblock %}
