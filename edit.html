{% extends "base.html" %}

{% block title %}
Edit Post - My Blog
{% endblock %}


{% block content %}

<section class="form-section">

    <h1>Edit Post</h1>

    <form
        method="POST"
        class="post-form"
    >

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ post['title'] }}"
            required
        >


        <label for="category">
            Category
        </label>

        <input
            type="text"
            id="category"
            name="category"
            value="{{ post['category'] or '' }}"
        >


        <label for="content">
            Content
        </label>

        <textarea
            id="content"
            name="content"
            rows="15"
            required
        >{{ post["content"] }}</textarea>


        <button type="submit" class="button">
            Save Changes
        </button>

    </form>

</section>

{% endblock %}
